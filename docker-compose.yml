services:
  mysql:
    image: mysql:8.4
    container_name: deam-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: deam
      MYSQL_USER: deam_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - deam_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  deam_mysql_data:
